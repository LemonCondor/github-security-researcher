[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-security-researcher"
version = "0.1.0"
description = "Policy-gated GitHub security research: scan, validate, patch, report."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
scanners = ["semgrep", "pip-audit"]
analysis = ["tree-sitter>=0.23", "tree-sitter-go>=0.23", "tree-sitter-solidity>=1.2"]   # go_dataflow: syntax only, no Go toolchain

[project.scripts]
github-sec = "github_security.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
